---
- name: Ensure /opt/alloy directory exists
  ansible.builtin.file:
    path: /opt/alloy
    state: directory
    owner: adminos
    group: adminos
    mode: "0755"
  become: true

- name: Render config.alloy
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /opt/alloy/config.alloy
    mode: "0644"

- name: Render beyla.yml
  ansible.builtin.template:
    src: beyla.yml.j2
    dest: /opt/alloy/beyla.yml
    mode: "0644"
  when: beyla_services is defined

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.alloy.yml.j2
    dest: /opt/alloy/docker-compose.yml
    mode: "0644"

- name: Enable nginx stub_status
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/stub_status.conf
    content: |
      server {
        listen 127.0.0.1:8080;
        location /stub_status {
          stub_status;
          allow 127.0.0.1;
          deny all;
        }
      }
    mode: "0644"
  become: true
  when: nginx_status_url is defined
  notify: reload nginx

- name: Pull latest alloy image
  community.docker.docker_image:
    name: grafana/alloy
    tag: latest
    source: pull
    force_source: true
  become: true

- name: Pull latest beyla image
  community.docker.docker_image:
    name: grafana/beyla
    tag: latest
    source: pull
    force_source: true
  become: true
  when: beyla_services is defined

- name: Deploy via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/alloy
    state: present
    recreate: always
  become: true

- name: Wait for alloy to be ready
  ansible.builtin.uri:
    url: "http://localhost:12345/-/ready"
    status_code: 200
  register: alloy_health
  retries: 12
  delay: 5
  until: alloy_health.status == 200

---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
    state: present
    update_cache: true
  become: true

- name: Add Grafana GPG key
  ansible.builtin.shell:
    cmd: >
      wget -q -O - https://apt.grafana.com/gpg.key |
      gpg --dearmor |
      tee /etc/apt/keyrings/grafana.gpg > /dev/null
    creates: /etc/apt/keyrings/grafana.gpg
  become: true

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present
  become: true

- name: Install alloy
  ansible.builtin.apt:
    name: alloy
    state: latest
    update_cache: true
  become: true

- name: Render config.alloy
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: alloy
    group: alloy
    mode: "0644"
  become: true
  notify: restart alloy

- name: Enable and start alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
  become: true

- name: Wait for alloy to be ready
  ansible.builtin.uri:
    url: "http://localhost:12345/-/ready"
    status_code: 200
  register: alloy_health
  retries: 12
  delay: 5
  until: alloy_health.status == 200

# ── Beyla (optional) ────────────────────────────────────────────────────────────

- name: Download beyla binary
  ansible.builtin.get_url:
    url: "https://github.com/grafana/beyla/releases/download/v{{ beyla_version }}/beyla_linux_amd64"
    dest: /usr/local/bin/beyla
    mode: "0755"
  become: true
  when: beyla_services is defined

- name: Ensure /etc/beyla directory exists
  ansible.builtin.file:
    path: /etc/beyla
    state: directory
    mode: "0755"
  become: true
  when: beyla_services is defined

- name: Render beyla.yml
  ansible.builtin.template:
    src: beyla.yml.j2
    dest: /etc/beyla/beyla.yml
    mode: "0644"
  become: true
  when: beyla_services is defined
  notify: restart beyla

- name: Render beyla systemd service
  ansible.builtin.template:
    src: beyla.service.j2
    dest: /etc/systemd/system/beyla.service
    mode: "0644"
  become: true
  when: beyla_services is defined
  notify: restart beyla

- name: Enable and start beyla service
  ansible.builtin.systemd:
    name: beyla
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: beyla_services is defined

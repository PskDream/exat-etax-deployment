env: prod
ecr_registry: "554729428605.dkr.ecr.ap-southeast-7.amazonaws.com"
aws_region: "ap-southeast-7"

services:
  generator:
    repository: "exat/e-tax/generate"
    app_port: 9000
    container_port: 9000
    env_file:
      - "/opt/generate/.env"
    volumes:
      - "/opt/generator/keys:/keys"
    health_path: "/health"
    nfs_server_ip: "10.204.61.26"
    nfs_device_path: "/exatprd"

  rest-pdf:
    repository: "exat/e-tax/rest-pdf"
    app_port: 8000
    container_port: 8000
    env_file:
      - "/opt/rest-pdf/.env"
    volumes:
      - "/opt/rest-pdf/resources:/app/resources"
    health_path: "/actuator/health"

  rest-hsm:
    type: systemd
    systemd_service: rest-hsm.service
    jar_dest: "/home/adminos/rest-hsm/rest-hsm-0.0.1-SNAPSHOT.jar"
    user: root
    health_port: 8080
    health_path: "/actuator/health"

